<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Price</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:28px 18px 32px;
  text-align:center;
}

.logo{
  font-size:32px;
  font-weight:bold;
}

.subtitle{
  margin-top:8px;
  color:#cbd5e1;
  font-size:15px;
}

main{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.search-area{
  margin-top:-5px;
}

.search-box{
  display:flex;
  gap:8px;
  background:white;
  padding:7px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.search-box input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  padding:14px 12px;
  font-size:16px;
  background:white;
}

.search-box button{
  border:0;
  border-radius:11px;
  padding:0 18px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  font-size:15px;
}

.location-box{
  margin:15px 0;
  padding:13px 15px;
  background:white;
  border-radius:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  color:#374151;
}

.section-title{
  margin:20px 0 12px;
  font-size:19px;
  font-weight:bold;
}

.card{
  background:white;
  border-radius:17px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  cursor:pointer;
  transition:.15s;
}

.card:active{
  transform:scale(.98);
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.product-name{
  font-size:19px;
  font-weight:bold;
}

.price{
  margin-top:8px;
  font-size:25px;
  font-weight:bold;
  color:#16a34a;
}

.status{
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  height:max-content;
}

.available{
  background:#dcfce7;
  color:#15803d;
}

.unavailable{
  background:#fee2e2;
  color:#b91c1c;
}

.info{
  margin-top:13px;
  color:#6b7280;
  line-height:1.8;
  font-size:14px;
}

.distance{
  color:#2563eb;
  font-weight:bold;
}

.updated{
  margin-top:8px;
  font-size:12px;
  color:#9ca3af;
}

.not-found{
  background:white;
  border-radius:16px;
  padding:30px 18px;
  text-align:center;
  color:#6b7280;
}

.details-page{
  display:none;
}

.back-button{
  border:0;
  background:#111827;
  color:white;
  padding:12px 16px;
  border-radius:11px;
  font-size:15px;
  font-weight:bold;
  margin-bottom:14px;
}

.details-card{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.details-card h2{
  margin:0;
  font-size:28px;
}

.details-price{
  font-size:32px;
  font-weight:bold;
  color:#16a34a;
  margin:15px 0;
}

.detail-row{
  padding:14px 0;
  border-bottom:1px solid #e5e7eb;
  line-height:1.5;
}

.detail-row:last-child{
  border-bottom:0;
}

.label{
  color:#6b7280;
  font-size:13px;
}

.value{
  margin-top:3px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-top:15px;
  padding:8px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
}

@media(max-width:480px){
  header{
    padding-top:24px;
  }

  .logo{
    font-size:28px;
  }

  main{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌍 World Price</div>
  <div class="subtitle">
    Search products, food, services and prices
  </div>
</header>

<main>

  <!-- SEARCH PAGE -->
  <section id="searchPage">

    <div class="search-area">

      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="Search anything..."
          onkeydown="handleEnter(event)"
        >

        <button onclick="searchProducts()">
          Search
        </button>
      </div>

    </div>

    <div class="location-box">
      📍 <strong>Your Location</strong><br>
      <span id="locationText">
        Location not selected
      </span>
    </div>

    <div class="section-title">
      Nearby & Popular
    </div>

    <div id="results"></div>

  </section>


  <!-- DETAILS PAGE -->
  <section id="detailsPage" class="details-page"></section>

</main>


<script>

const products = [

  {
    name:"iPhone 15",
    price:"₹59,999",
    location:"Thiruvananthapuram",
    distance:"1.8 km",
    source:"Sample Mobile Store",
    available:true,
    updated:"Today"
  },

  {
    name:"Samsung Galaxy S24",
    price:"₹64,999",
    location:"Kazhakuttam",
    distance:"3.2 km",
    source:"Sample Mobile Store",
    available:true,
    updated:"Today"
  },

  {
    name:"Chicken Biryani",
    price:"₹180 / plate",
    location:"Kazhakuttam",
    distance:"1.2 km",
    source:"Sample Restaurant",
    available:true,
    updated:"Today"
  },

  {
    name:"Yamaha R15",
    price:"₹1,85,000",
    location:"Thiruvananthapuram",
    distance:"5.6 km",
    source:"Sample Yamaha Dealer",
    available:true,
    updated:"Today"
  },

  {
    name:"Electrical Wire",
    price:"₹850",
    location:"Kazhakuttam",
    distance:"2.4 km",
    source:"Sample Electrical Store",
    available:true,
    updated:"Today"
  },

  {
    name:"Auto Rickshaw",
    price:"₹80 approx.",
    location:"Nearby",
    distance:"0.7 km",
    source:"Sample Transport Service",
    available:true,
    updated:"Just now"
  }

];


function showProducts(list){

  const results=document.getElementById("results");

  if(list.length===0){

    results.innerHTML=`
      <div class="not-found">
        <div style="font-size:35px;">🔎</div>

        <h3>No result found</h3>

        <p>
          We couldn't find this item in the current data.
        </p>

        <p>
          Live data sources will be connected later.
        </p>
      </div>
    `;

    return;
  }


  results.innerHTML=list.map(product=>{

    const index=products.indexOf(product);

    return `

      <div class="card"
           onclick="showDetails(${index})">

        <div class="card-top">

          <div>

            <div class="product-name">
              ${product.name}
            </div>

            <div class="price">
              ${product.price}
            </div>

          </div>

          <div class="status ${
            product.available
            ? "available"
            : "unavailable"
          }">

            ${
              product.available
              ? "✓ Available"
              : "✕ Not Available"
            }

          </div>

        </div>


        <div class="info">

          📍 ${product.location}<br>

          📏 <span class="distance">
            ${product.distance}
          </span><br>

          🏪 ${product.source}

        </div>


        <div class="updated">
          🕒 Updated: ${product.updated}
        </div>

      </div>

    `;

  }).join("");
}


function searchProducts(){

  const query=document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();


  if(query===""){

    showProducts(products);

    return;
  }


  const filtered=products.filter(product=>{

    return product.name
      .toLowerCase()
      .includes(query);

  });


  showProducts(filtered);
}


function handleEnter(event){

  if(event.key==="Enter"){

    searchProducts();

  }

}


function showDetails(index){

  const product=products[index];

  document
    .getElementById("searchPage")
    .style.display="none";


  const details=document
    .getElementById("detailsPage");


  details.style.display="block";


  details.innerHTML=`

    <button
      class="back-button"
      onclick="goBack()">

      ⬅️ Back

    </button>


    <div class="details-card">

      <h2>
        ${product.name}
      </h2>


      <div class="details-price">
        ${product.price}
      </div>


      <div class="badge ${
        product.available
        ? "available"
        : "unavailable"
      }">

        ${
          product.available
          ? "✓ Currently Available"
          : "✕ Currently Not Available"
        }

      </div>


      <div class="detail-row">

        <div class="label">
          📍 Location
        </div>

        <div class="value">
          ${product.location}
        </div>

      </div>


      <div class="detail-row">

        <div class="label">
          📏 Distance
        </div>

        <div class="value">
          ${product.distance}
        </div>

      </div>


      <div class="detail-row">

        <div class="label">
          🏪 Available At
        </div>

        <div class="value">
          ${product.source}
        </div>

      </div>


      <div class="detail-row">

        <div class="label">
          🕒 Latest Update
        </div>

        <div class="value">
          ${product.updated}
        </div>

      </div>

    </div>

  `;


  /*
    Add browser history state.

    This makes the Android phone Back button
    return to the World Price search page
    instead of immediately leaving the page.
  */

  history.pushState(
    {page:"details"},
    "",
    "#details"
  );

}


function goBack(){

  const details=document
    .getElementById("detailsPage");

  details.style.display="none";


  document
    .getElementById("searchPage")
    .style.display="block";


  if(location.hash==="#details"){

    history.back();

  }

}


/*
  Android / browser Back button

  If the user is on Product Details,
  go back to the World Price search page.
*/

window.addEventListener("popstate",function(){

  const details=document
    .getElementById("detailsPage");


  if(details.style.display==="block"){

    details.style.display="none";


    document
      .getElementById("searchPage")
      .style.display="block";

  }

});


/*
  Demo location.

  Later this can be replaced with
  real GPS / Maps API location.
*/

function getLocation(){

  if(!navigator.geolocation){

    document.getElementById("locationText")
      .textContent="Location unavailable";

    return;
  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      document.getElementById("locationText")
        .textContent=
        "Location detected";

    },

    function(){

      document.getElementById("locationText")
        .textContent=
        "Location permission not allowed";

    }

  );

}


showProducts(products);

getLocation();

</script>

</body>
</html>
