<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>World Price</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  color:#111827;
}

.app{
  max-width:480px;
  margin:auto;
  min-height:100vh;
  background:#ffffff;
  padding-bottom:80px;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 18px 12px;
}

.logo{
  font-size:24px;
  font-weight:800;
  color:#1769ff;
}

.logo span{
  color:#111827;
}

.notification{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:#f1f5f9;
  font-size:20px;
}

/* INTRO */
.intro{
  padding:8px 18px 18px;
}

.intro h1{
  font-size:27px;
  line-height:1.2;
  margin-bottom:7px;
}

.intro p{
  color:#6b7280;
  font-size:14px;
}

/* SEARCH */
.search-box{
  margin:0 18px 18px;
  display:flex;
  align-items:center;
  background:#f8fafc;
  border:1px solid #dbe2ea;
  border-radius:18px;
  height:58px;
  padding:0 8px 0 16px;
}

.search-icon{
  font-size:21px;
  margin-right:9px;
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  background:transparent;
  font-size:15px;
  min-width:0;
}

.voice-btn{
  width:44px;
  height:44px;
  border:none;
  border-radius:14px;
  background:#1769ff;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.voice-btn:active{
  transform:scale(.95);
}

/* LOCATION */
.location{
  margin:0 18px 22px;
  padding:14px;
  border-radius:16px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  gap:11px;
}

.location-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#e8f0ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.location-info{
  flex:1;
}

.location-title{
  font-size:12px;
  color:#6b7280;
  margin-bottom:3px;
}

.location-name{
  font-size:14px;
  font-weight:600;
}

.change-btn{
  border:none;
  background:none;
  color:#1769ff;
  font-weight:600;
  cursor:pointer;
}

/* SECTION */
.section{
  padding:0 18px;
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-header h2{
  font-size:19px;
}

.section-header button{
  border:none;
  background:none;
  color:#1769ff;
  font-weight:600;
}

/* CATEGORIES */
.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:26px;
}

.category{
  border:none;
  background:#f8fafc;
  border-radius:16px;
  padding:14px 5px;
  cursor:pointer;
  transition:.2s;
}

.category:active{
  transform:scale(.95);
}

.category-icon{
  width:45px;
  height:45px;
  margin:0 auto 8px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.category:nth-child(1) .category-icon{
  background:#e8f1ff;
}

.category:nth-child(2) .category-icon{
  background:#fff0e8;
}

.category:nth-child(3) .category-icon{
  background:#e9f8ed;
}

.category:nth-child(4) .category-icon{
  background:#f0eaff;
}

.category:nth-child(5) .category-icon{
  background:#fff5dc;
}

.category:nth-child(6) .category-icon{
  background:#e8f7ff;
}

.category:nth-child(7) .category-icon{
  background:#e9f8ee;
}

.category:nth-child(8) .category-icon{
  background:#f0edff;
}

.category-name{
  font-size:12px;
  font-weight:700;
}

/* POPULAR SEARCH */
.popular{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.popular::-webkit-scrollbar{
  display:none;
}

.popular button{
  white-space:nowrap;
  border:1px solid #e1e7ef;
  background:white;
  border-radius:20px;
  padding:9px 14px;
  font-size:13px;
  cursor:pointer;
}

/* BOTTOM NAVIGATION */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:70px;
  background:white;
  border-top:1px solid #e5e7eb;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:100;
}

.nav-btn{
  border:none;
  background:white;
  color:#6b7280;
  font-size:11px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.nav-btn span{
  font-size:21px;
}

.nav-btn.active{
  color:#1769ff;
  font-weight:700;
}

/* MESSAGE */
.message{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:420px;
  padding:13px 16px;
  background:#111827;
  color:white;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  display:none;
  z-index:200;
}

/* DESKTOP */
@media(min-width:700px){
  body{
    padding:25px 0;
  }

  .app{
    border-radius:24px;
    box-shadow:0 10px 40px rgba(0,0,0,.08);
    overflow:hidden;
  }

  .bottom-nav{
    border-radius:0 0 24px 24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">WORLD <span>PRICE</span></div>
    <button class="notification" onclick="showMessage('Notifications will be added later.')">
      🔔
    </button>
  </header>

  <!-- INTRO -->
  <section class="intro">
    <h1>Find the price.<br>Anywhere.</h1>
    <p>Search products, food, vehicles, hotels and more.</p>
  </section>

  <!-- SEARCH -->
  <div class="search-box">
    <div class="search-icon">🔍</div>

    <input
      id="searchInput"
      type="text"
      placeholder="Search anything..."
      onkeydown="handleSearch(event)"
    >

    <button
      class="voice-btn"
      onclick="startVoiceSearch()"
      title="Voice Search"
    >
      🎙️
    </button>
  </div>

  <!-- LOCATION -->
  <div class="location">

    <div class="location-icon">📍</div>

    <div class="location-info">
      <div class="location-title">Your Location</div>
      <div class="location-name" id="locationName">
        Location not selected
      </div>
    </div>

    <button class="change-btn" onclick="getLocation()">
      Change
    </button>

  </div>

  <!-- CATEGORIES -->
  <section class="section">

    <div class="section-header">
      <h2>Explore</h2>
    </div>

    <div class="categories">

      <button class="category" onclick="openCategory('Mobile')">
        <div class="category-icon">📱</div>
        <div class="category-name">Mobile</div>
      </button>

      <button class="category" onclick="openCategory('Food')">
        <div class="category-icon">🍔</div>
        <div class="category-name">Food</div>
      </button>

      <button class="category" onclick="openCategory('Vehicles')">
        <div class="category-icon">🚗</div>
        <div class="category-name">Vehicles</div>
      </button>

      <button class="category" onclick="openCategory('Hotels')">
        <div class="category-icon">🏨</div>
        <div class="category-name">Hotels</div>
      </button>

      <button class="category" onclick="openCategory('Property')">
        <div class="category-icon">🏠</div>
        <div class="category-name">Property</div>
      </button>

      <button class="category" onclick="openCategory('Electronics')">
        <div class="category-icon">💻</div>
        <div class="category-name">Electronics</div>
      </button>

      <button class="category" onclick="openCategory('Grocery')">
        <div class="category-icon">🛒</div>
        <div class="category-name">Grocery</div>
      </button>

      <button class="category" onclick="openCategory('Services')">
        <div class="category-icon">🧰</div>
        <div class="category-name">Services</div>
      </button>

    </div>

  </section>

  <!-- POPULAR SEARCHES -->
  <section class="section">

    <div class="section-header">
      <h2>Popular Searches</h2>
    </div>

    <div class="popular">

      <button onclick="quickSearch('iPhone')">
        iPhone
      </button>

      <button onclick="quickSearch('Biryani')">
        Biryani
      </button>

      <button onclick="quickSearch('Toyota Car')">
        Toyota Car
      </button>

      <button onclick="quickSearch('Hotel')">
        Hotel
      </button>

      <button onclick="quickSearch('Laptop')">
        Laptop
      </button>

    </div>

  </section>

</div>


<!-- MESSAGE -->
<div class="message" id="message"></div>


<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showMessage('You are already on Home.')">
    <span>⌂</span>
    Home
  </button>

  <button class="nav-btn" onclick="showMessage('Search page will be added later.')">
    <span>⌕</span>
    Search
  </button>

  <button class="nav-btn" onclick="showMessage('Saved items will be added later.')">
    <span>♡</span>
    Saved
  </button>

  <button class="nav-btn" onclick="getLocation()">
    <span>⌖</span>
    Nearby
  </button>

  <button class="nav-btn" onclick="showMessage('More options will be added later.')">
    <span>☰</span>
    More
  </button>

</nav>


<script>

/* MESSAGE */
function showMessage(text){

  const message = document.getElementById("message");

  message.innerText = text;
  message.style.display = "block";

  setTimeout(function(){
    message.style.display = "none";
  },2500);
}


/* SEARCH */
function handleSearch(event){

  if(event.key === "Enter"){

    const value = document.getElementById("searchInput").value.trim();

    if(value === ""){
      showMessage("Please enter something to search.");
      return;
    }

    showMessage("Searching for: " + value);
  }
}


/* QUICK SEARCH */
function quickSearch(value){

  document.getElementById("searchInput").value = value;

  document.getElementById("searchInput").focus();
}


/* CATEGORY */
function openCategory(category){

  showMessage(category + " section will be built next.");
}


/* VOICE SEARCH */
function startVoiceSearch(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    showMessage("Voice search is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;

  showMessage("Listening... Speak now.");

  recognition.start();

  recognition.onresult = function(event){

    const text = event.results[0][0].transcript;

    document.getElementById("searchInput").value = text;

    showMessage("Voice search: " + text);
  };

  recognition.onerror = function(){

    showMessage("Voice search could not be completed.");
  };
}


/* LOCATION */
function getLocation(){

  if(!navigator.geolocation){

    showMessage("Location is not supported by this browser.");
    return;
  }

  showMessage("Getting your location...");

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      document.getElementById("locationName").innerText =
        "Location detected";

      showMessage(
        "Location detected successfully."
      );

      console.log("Latitude:", lat);
      console.log("Longitude:", lon);
    },

    function(){

      showMessage(
        "Location permission was not allowed."
      );
    }
  );
}

</script>

</body>
</html>
